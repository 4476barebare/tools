name: Vectorize images
on:
  push:
    paths:
      - "images/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install vtracer
      - run: python convert.py
      - name: Commit SVGs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add svg
          git diff --cached --quiet || git commit -m "Add vectorized SVGs"
          git push
