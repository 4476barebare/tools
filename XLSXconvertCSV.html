<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XLSX → CSV / JSON 変換</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#667085;--line:#d8e0ea;--blue:#155eef;--pale:#f3f6fb}
*{box-sizing:border-box}
body{margin:0;background:var(--pale);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif}
main{width:min(100% - 32px,720px);margin:5vh auto;padding:28px;background:#fff;border:1px solid #e7ebf1;border-radius:18px;box-shadow:0 12px 36px #1822300d}
h1{font-size:1.35rem;margin:0 0 10px}
p{line-height:1.7;color:var(--muted);font-size:.92rem}
.drop{display:block;margin:22px 0 16px;padding:26px 16px;border:2px dashed #c4cfdd;border-radius:12px;text-align:center;background:#f8fafc;cursor:pointer}
.drop:focus-within,.drop.has-file{border-color:var(--blue);background:#f1f6ff}
.drop strong{display:block;margin-bottom:8px}
#fileName{display:block;color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
input[type=file]{display:block;width:100%;margin-top:14px;font-size:.9rem}
.options{margin:0 0 18px;padding:14px 16px;background:#f8fafc;border:1px solid var(--line);border-radius:12px}
.opt-label{display:block;font-size:.85rem;font-weight:700;margin-bottom:8px;color:var(--ink)}
.format-group{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.format-item{position:relative}
.format-item input{position:absolute;opacity:0;pointer-events:none}
.format-item span{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:center;font-size:.92rem;font-weight:700;cursor:pointer;transition:all .15s}
.format-item input:checked + span{border-color:var(--blue);background:#eef4ff;color:var(--blue)}

/* 横スクロール対応プレビュー＆列ごと数値チェックUI */
.preview-box{display:none;margin:0 0 18px;padding:14px 16px;background:#f8fafc;border:1px solid var(--line);border-radius:12px}
.preview-box.active{display:block}
.preview-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.preview-sub{font-size:.8rem;color:var(--muted)}
.preview-actions{display:flex;gap:6px}
.mini-btn{padding:5px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:.8rem;font-weight:600;cursor:pointer;width:auto}
.mini-btn:hover{border-color:var(--blue);color:var(--blue)}
.table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;background:#fff}
.preview-table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;font-size:.84rem}
.preview-table th,.preview-table td{padding:9px 12px;border-right:1px solid #edf0f4;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:top;min-width:115px;max-width:220px}
.preview-table th:last-child,.preview-table td:last-child{border-right:0}
.preview-table tr:last-child th,.preview-table tr:last-child td{border-bottom:0}
.preview-table .row-label{position:sticky;left:0;z-index:2;background:#f1f5f9;font-weight:700;color:#334155;min-width:96px;max-width:96px;white-space:nowrap;border-right:2px solid var(--line)}
.chk-cell{background:#f8fafc}
.num-chk-label{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink);cursor:pointer;user-select:none;white-space:nowrap}
.num-chk-label input{width:16px;height:16px;margin:0;accent-color:var(--blue);cursor:pointer}
.hdr-cell{font-weight:700;color:var(--ink);background:#fff;word-break:break-all}
.sample-cell{color:var(--muted);background:#fff}
/* td自体にdisplay:-webkit-boxを当てるとテーブルセル構造が壊れて縦並びになるため、内部divに適用する */
.cell-clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;line-height:1.45}
.empty-tag{color:#94a3b8;font-style:italic;font-weight:400}

button.primary-btn{width:100%;padding:14px 18px;border:0;border-radius:10px;background:var(--blue);color:white;font-size:1rem;font-weight:700;cursor:pointer}
button.primary-btn:disabled{background:#aab4c3;cursor:not-allowed}
#status{min-height:1.5em;margin:14px 0 0;font-size:.9rem;font-weight:600;color:#067647;overflow-wrap:anywhere}
#status.error{color:#b42318}
.note{border-top:1px solid #edf0f4;margin-top:22px;padding-top:14px;font-size:.8rem}
</style>
</head>
<body>
<main>
  <h1>XLSX → CSV / JSON 変換</h1>
  <p>Excelファイルの最初のシートを読み込み、ヘッダーと1行目のプレビューを確認しながらCSVまたはJSONに変換します。基本はテキストとして扱い、「数値」にチェックを入れた列だけ数値として出力します。</p>
  <label class="drop" id="drop">
    <strong>Excelファイルを選択</strong>
    <span id="fileName">.xlsx ファイルを指定してください</span>
    <input id="file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
  </label>

  <div class="options">
    <span class="opt-label">出力形式を選択</span>
    <div class="format-group">
      <label class="format-item">
        <input type="radio" name="outputFormat" value="csv" checked>
        <span>CSV (.csv)</span>
      </label>
      <label class="format-item">
        <input type="radio" name="outputFormat" value="json">
        <span>JSON (.json)</span>
      </label>
    </div>
  </div>

  <div class="preview-box" id="previewBox">
    <div class="preview-head">
      <div>
        <span class="opt-label" style="margin-bottom:2px">列プレビュー＆数値指定（横スクロール可）</span>
        <span class="preview-sub" id="previewMeta">チェックした列は数値扱い、未チェックはテキスト扱いになります</span>
      </div>
      <div class="preview-actions">
        <button type="button" class="mini-btn" id="clearAllNumBtn">すべて解除</button>
      </div>
    </div>
    <div class="table-scroll">
      <table class="preview-table">
        <tbody id="previewTbody"></tbody>
      </table>
    </div>
  </div>

  <button id="convert" class="primary-btn" disabled>CSVに変換してダウンロード</button>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="note">変換はブラウザ内で行います。選択したExcelファイルは変換のために外部サーバーへ送信されません。CSV/JSONはUTF-8（BOMなし）です。</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(() => {
  const fileInput = document.getElementById('file');
  const fileName = document.getElementById('fileName');
  const drop = document.getElementById('drop');
  const button = document.getElementById('convert');
  const status = document.getElementById('status');
  const formatRadios = document.querySelectorAll('input[name="outputFormat"]');
  const previewBox = document.getElementById('previewBox');
  const previewTbody = document.getElementById('previewTbody');
  const previewMeta = document.getElementById('previewMeta');
  const clearAllNumBtn = document.getElementById('clearAllNumBtn');

  let selectedFile = null;
  let parsedSheetData = null; // { rows, maxCols, lastNonEmptyRowIndex }

  function setStatus(message, isError = false) {
    status.textContent = message;
    status.classList.toggle('error', isError);
  }

  function getSelectedFormat() {
    const checked = document.querySelector('input[name="outputFormat"]:checked');
    return checked ? checked.value : 'csv';
  }

  function updateFormatUI() {
    const fmt = getSelectedFormat();
    button.textContent = fmt === 'json' ? 'JSONに変換してダウンロード' : 'CSVに変換してダウンロード';
    setStatus('');
  }

  formatRadios.forEach(radio => {
    radio.addEventListener('change', updateFormatUI);
  });

  // パス部分と末尾の拡張子を取り除く
  function makeOutputName(originalName, ext) {
    const base = originalName.replace(/^.*[\\/]/u, '');
    const withoutExt = base.replace(/\.[^.]*$/u, '');
    return (withoutExt.trim() ? withoutExt : 'converted') + '.' + ext;
  }

  // PHP fputcsv() の既定 escape "\" に合わせたCSVフィールド化
  function csvField(value) {
    let s = value == null ? '' : String(value);
    if (/[,"\r\n\\]/.test(s)) {
      s = s.replace(/\\/g, '\\\\').replace(/"/g, '\"');
      return '"' + s + '"';
    }
    return s;
  }

  // セル取得：数値チェックのON/OFFに使えるよう生値(raw)を取得
  function extractCellObj(cell) {
    if (!cell || cell.v == null) {
      return { raw: '' };
    }
    let rawStr = '';
    if (cell.t === 'n') {
      rawStr = String(cell.v);
    } else if (cell.t === 'b') {
      rawStr = cell.v ? '1' : '0';
    } else {
      rawStr = String(cell.v);
    }
    rawStr = rawStr.replace(/\r\n|\r|\n/g, ' ');

    return { raw: rawStr };
  }

  // Excelシートを解析して内部データ化
  async function parseExcelFile(file) {
    if (!window.XLSX) {
      throw new Error('Excel解析ライブラリを読み込めませんでした。通信環境を確認してください。');
    }
    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: 'array', cellDates: false });
    if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
      throw new Error('Excelファイルにシートがありません。');
    }

    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    if (!sheet || !sheet['!ref']) {
      return { rows: [], maxCols: 0, lastNonEmptyRowIndex: -1 };
    }

    const range = XLSX.utils.decode_range(sheet['!ref']);
    let maxCols = 0;
    let lastNonEmptyRowIndex = -1;
    const rows = [];

    for (let r = 0; r <= range.e.r; r++) {
      const row = [];
      let rowHasValue = false;
      for (let c = 0; c <= range.e.c; c++) {
        const address = XLSX.utils.encode_cell({ r, c });
        const cell = sheet[address];
        const cellObj = extractCellObj(cell);
        row[c] = cellObj;
        if (cellObj.raw.trim() !== '') {
          rowHasValue = true;
          if (c + 1 > maxCols) maxCols = c + 1;
        }
      }
      rows[r] = row;
      if (rowHasValue) lastNonEmptyRowIndex = r;
    }

    return { rows, maxCols, lastNonEmptyRowIndex };
  }

  // 横スクロール対応の3段プレビュー（数値チェック / ヘッダー / 1行目データ）を描画
  function renderPreview(sheetData) {
    previewTbody.innerHTML = '';

    if (!sheetData || sheetData.lastNonEmptyRowIndex < 0 || sheetData.maxCols <= 0) {
      previewBox.classList.remove('active');
      return;
    }

    const { rows, maxCols, lastNonEmptyRowIndex } = sheetData;
    const headerRow = rows[0] || [];
    const firstDataRow = lastNonEmptyRowIndex >= 1 ? (rows[1] || []) : [];

    // 1段目: ⬜︎ 数値 チェックボックス行
    const trCheck = document.createElement('tr');
    const thCheck = document.createElement('th');
    thCheck.className = 'row-label';
    thCheck.textContent = '型指定';
    trCheck.appendChild(thCheck);

    // 2段目: ヘッダー行（Excel 1行目）
    const trHeader = document.createElement('tr');
    const thHeader = document.createElement('th');
    thHeader.className = 'row-label';
    thHeader.textContent = 'ヘッダー';
    trHeader.appendChild(thHeader);

    // 3段目: データ1行目（Excel 2行目）
    const trSample = document.createElement('tr');
    const thSample = document.createElement('th');
    thSample.className = 'row-label';
    thSample.textContent = '1行目データ';
    trSample.appendChild(thSample);

    for (let c = 0; c < maxCols; c++) {
      // チェックボックスセル（初期値はすべて未チェック＝テキスト扱い）
      const tdChk = document.createElement('td');
      tdChk.className = 'chk-cell';
      const label = document.createElement('label');
      label.className = 'num-chk-label';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.className = 'col-num-check';
      input.dataset.colIndex = String(c);
      const span = document.createElement('span');
      span.textContent = '数値';
      label.appendChild(input);
      label.appendChild(span);
      tdChk.appendChild(label);
      trCheck.appendChild(tdChk);

      // ヘッダーセル
      const tdHdr = document.createElement('td');
      tdHdr.className = 'hdr-cell';
      const hdrWrap = document.createElement('div');
      hdrWrap.className = 'cell-clamp';
      const hdrText = headerRow[c] ? headerRow[c].raw.trim() : '';
      if (hdrText !== '') {
        hdrWrap.textContent = hdrText;
      } else {
        const emptyEl = document.createElement('span');
        emptyEl.className = 'empty-tag';
        emptyEl.textContent = `(列${c + 1} 空欄)`;
        hdrWrap.appendChild(emptyEl);
      }
      tdHdr.appendChild(hdrWrap);
      trHeader.appendChild(tdHdr);

      // 1行目データセル（tdではなく内部のdivに省略表示を適用してセル構造を維持）
      const tdSmp = document.createElement('td');
      tdSmp.className = 'sample-cell';
      const smpWrap = document.createElement('div');
      smpWrap.className = 'cell-clamp';
      const smpText = firstDataRow[c] ? firstDataRow[c].raw : '';
      if (smpText !== '') {
        smpWrap.textContent = smpText;
      } else {
        const emptyEl = document.createElement('span');
        emptyEl.className = 'empty-tag';
        emptyEl.textContent = '(空欄)';
        smpWrap.appendChild(emptyEl);
      }
      tdSmp.appendChild(smpWrap);
      trSample.appendChild(tdSmp);
    }

    previewTbody.appendChild(trCheck);
    previewTbody.appendChild(trHeader);
    previewTbody.appendChild(trSample);

    const dataRowCount = Math.max(0, lastNonEmptyRowIndex);
    previewMeta.textContent = `全 ${maxCols} 列 / データ ${dataRowCount} 行（チェックした列のみ数値として処理します）`;
    previewBox.classList.add('active');
  }

  clearAllNumBtn.addEventListener('click', () => {
    document.querySelectorAll('.col-num-check').forEach(chk => {
      chk.checked = false;
    });
  });

  fileInput.addEventListener('change', async () => {
    selectedFile = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
    fileName.textContent = selectedFile ? selectedFile.name : '.xlsx ファイルを指定してください';
    drop.classList.toggle('has-file', !!selectedFile);
    button.disabled = true;
    parsedSheetData = null;
    setStatus('');

    if (!selectedFile) {
      previewBox.classList.remove('active');
      return;
    }

    try {
      setStatus('ファイルを読み込み中です…');
      parsedSheetData = await parseExcelFile(selectedFile);
      renderPreview(parsedSheetData);
      button.disabled = false;
      setStatus('');
    } catch (error) {
      previewBox.classList.remove('active');
      setStatus('❌ エラー: ' + (error && error.message ? error.message : 'ファイルの解析に失敗しました。'), true);
    }
  });

  // 各列の「数値」チェック状態を取得
  function getNumericColumnFlags(maxCols) {
    const flags = new Array(maxCols).fill(false);
    document.querySelectorAll('.col-num-check').forEach(chk => {
      const idx = Number(chk.dataset.colIndex);
      if (Number.isInteger(idx) && idx >= 0 && idx < maxCols) {
        flags[idx] = chk.checked;
      }
    });
    return flags;
  }

  // 文字列を数値へ変換（カンマ除去対応・変換不能な場合は元の文字列にフォールバック）
  function toNumericIfPossible(rawVal) {
    const trimmed = String(rawVal).trim();
    if (trimmed === '') return '';
    const normalized = trimmed.replace(/,/g, '');
    const num = Number(normalized);
    return Number.isFinite(num) ? num : trimmed;
  }

  button.addEventListener('click', async () => {
    if (!selectedFile || !parsedSheetData) {
      setStatus('❌ エラー: ファイルを選択してください。', true);
      return;
    }

    const format = getSelectedFormat();
    button.disabled = true;
    setStatus('変換中です…');

    try {
      const { rows, maxCols, lastNonEmptyRowIndex } = parsedSheetData;

      if (lastNonEmptyRowIndex < 0 || maxCols <= 0) {
        const emptyContent = format === 'json' ? '[]' : '';
        const mimeType = format === 'json' ? 'application/json;charset=utf-8' : 'text/csv;charset=utf-8';
        setStatus('データがありません。空のファイルを出力します。');
        const blob = new Blob([emptyContent], { type: mimeType });
        downloadBlob(blob, makeOutputName(selectedFile.name, format));
        return;
      }

      const numFlags = getNumericColumnFlags(maxCols);

      if (format === 'csv') {
        const output = [];
        for (let r = 0; r <= lastNonEmptyRowIndex; r++) {
          const sourceRow = rows[r] || [];
          const cleanRow = [];
          for (let c = 0; c < maxCols; c++) {
            const cellObj = sourceRow[c];
            let val = cellObj ? cellObj.raw : '';
            if (r >= 1 && numFlags[c] && val.trim() !== '') {
              const numVal = toNumericIfPossible(val);
              val = String(numVal);
            }
            cleanRow.push(val);
          }
          output.push(cleanRow.map(csvField).join(','));
        }

        const csv = output.length ? output.join('\r\n') + '\r\n' : '';
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        downloadBlob(blob, makeOutputName(selectedFile.name, 'csv'));
        setStatus('変換が完了しました。CSVをダウンロードしました。');
      } else {
        // JSON汎用変換：元ファイルの1行目ヘッダーを忠実にキーとして使用
        const headerRow = rows[0] || [];
        const headers = [];
        for (let c = 0; c < maxCols; c++) {
          headers[c] = headerRow[c] ? headerRow[c].raw.trim() : '';
        }

        const allRows = [];
        for (let r = 1; r <= lastNonEmptyRowIndex; r++) {
          const sourceRow = rows[r] || [];
          const rowObj = {};

          for (let c = 0; c < maxCols; c++) {
            const key = headers[c];
            if (!key) continue;

            const rawVal = sourceRow[c] ? sourceRow[c].raw.trim() : '';
            if (rawVal === '') continue;

            if (numFlags[c]) {
              rowObj[key] = toNumericIfPossible(rawVal);
            } else {
              rowObj[key] = rawVal;
            }
          }

          if (Object.keys(rowObj).length > 0) {
            allRows.push(rowObj);
          }
        }

        const jsonStr = JSON.stringify(allRows, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
        downloadBlob(blob, makeOutputName(selectedFile.name, 'json'));
        setStatus(`変換が完了しました（${allRows.length}件）。JSONをダウンロードしました。`);
      }
    } catch (error) {
      setStatus('❌ エラー: 変換に失敗しました。' + (error && error.message ? ' 詳細: ' + error.message : ''), true);
    } finally {
      button.disabled = !selectedFile;
    }
  });

  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
})();
</script>
</body>
</html>
