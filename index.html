<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>画像合成ツール</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>画像重ね合わせツール</h1>
    
    <!-- ① 背景キャンバスの設定（常時表示） -->
    <div class="section-box">
        <div class="header-line">
            <span class="sec-title">1. 背景キャンバスの設定</span>
            <div class="file-action-area">
                <span id="bgFileName" class="file-status">未選択</span>
                <label class="file-btn-label">
                    ファイルを選択
                    <input type="file" id="bgInput" accept="image/*">
                </label>
            </div>
        </div>

        <div class="size-row">
            <label class="inline-label">幅:<input type="number" id="canvasW" value="800">px</label>
            <label class="inline-label">高さ:<input type="number" id="canvasH" value="600">px</label>
            <button class="btn-small" onclick="updateCanvasSize()">サイズ適用</button>
        </div>

        <div class="select-row">
            <span class="inline-label">背景の配置:</span>
            <select id="bgMode" onchange="draw()">
                <option value="stretch">引き伸ばす（縦横比を無視）</option>
                <option value="cover">はみ出しをカット（縦横比維持・全面）</option>
                <option value="contain">余白を透明に補完（縦横比維持・全体）</option>
            </select>
        </div>
    </div>
    
    <!-- ② 重ねる要素の編集（タブ切り替えエリア） -->
    <div class="tab-wrapper">
        <div class="tab-header">
            <button type="button" class="tab-btn active" id="tabBtnImage" onclick="switchTab('image')">🖼️ 2. 画像を重ねる</button>
            <button type="button" class="tab-btn" id="tabBtnText" onclick="switchTab('text')">🔤 2. テキストを重ねる</button>
        </div>

        <!-- タブA: 画像を重ねる -->
        <div class="section-box tab-content" id="tabImage">
            <div class="header-line">
                <span class="sec-title">重ねる画像の読み込み</span>
                <div class="file-action-area">
                    <span id="fgFileName" class="file-status">未選択</span>
                    <label class="file-btn-label">
                        ファイルを選択
                        <input type="file" id="fgInput" accept="image/*">
                    </label>
                </div>
            </div>

            <button type="button" class="btn-paste" id="pasteBtn" onclick="handleButtonPaste()">
                📋 クリップボードからペースト
            </button>

            <div id="fallbackPasteArea" contenteditable="true" style="display: none;">
                <span style="pointer-events: none;">👆 ここを長押しして「ペースト」を選択</span>
            </div>

            <div id="statusMsg"></div>

            <div class="controls">
                <div class="d-pad">
                    <button type="button" class="up" onclick="moveActive(0, -10)">上</button>
                    <button type="button" class="left" onclick="moveActive(-10, 0)">左</button>
                    <button type="button" class="right" onclick="moveActive(10, 0)">右</button>
                    <button type="button" class="down" onclick="moveActive(0, 10)">下</button>
                </div>
                <div class="scale-control" id="scaleBox">
                    <strong>画像の縮尺: <span id="scaleValue">100%</span></strong>
                    <input type="range" id="fgScale" min="0.1" max="5.0" step="0.05" value="1.0" oninput="updateScale()">
                </div>
            </div>
        </div>

        <!-- タブB: テキストを重ねる -->
        <div class="section-box tab-content" id="tabText" style="display: none;">
            <div class="text-input-row">
                <textarea id="overlayText" rows="2" placeholder="ここに入力した文字がキャンバスに重なります（改行対応）" oninput="updateTextLayer()"></textarea>
                <button type="button" class="btn-clear-text" onclick="clearTextLayer()">消去</button>
            </div>

            <div class="text-style-row">
                <label class="inline-label">文字色:<input type="color" id="textColor" value="#ffffff" onchange="updateTextLayer()"></label>
                <label class="inline-label"><input type="checkbox" id="textOutline" checked onchange="updateTextLayer()">フチ:<input type="color" id="outlineColor" value="#000000" onchange="updateTextLayer()"></label>
                <label class="inline-label"><input type="checkbox" id="textBold" checked onchange="updateTextLayer()">太字</label>
            </div>

            <div class="select-row" style="margin-top: 6px;">
                <span class="inline-label">背景枠:</span>
                <select id="textBoxBg" onchange="updateTextLayer()">
                    <option value="none">なし（透明）</option>
                    <option value="rgba(0,0,0,0.6)">半透明の黒ボックス</option>
                    <option value="rgba(255,255,255,0.75)">半透明の白ボックス</option>
                    <option value="#000000">黒塗りボックス</option>
                    <option value="#ffffff">白塗りボックス</option>
                </select>
            </div>

            <div class="controls">
                <div class="d-pad">
                    <button type="button" class="up" onclick="moveActive(0, -10)">上</button>
                    <button type="button" class="left" onclick="moveActive(-10, 0)">左</button>
                    <button type="button" class="right" onclick="moveActive(10, 0)">右</button>
                    <button type="button" class="down" onclick="moveActive(0, 10)">下</button>
                </div>
                <div class="scale-control" id="textSizeBox">
                    <strong>文字サイズ: <span id="textSizeValue">40px</span></strong>
                    <input type="range" id="textSize" min="12" max="160" step="2" value="40" oninput="updateTextLayer()">
                </div>
            </div>
        </div>
    </div>

    <!-- ③ キャンバス表示 ＆ 新しい背景に設定・保存ボタン（常時表示） -->
    <div class="section-footer">
        <p class="guide-text" id="dragGuideText">※キャンバス上のドラッグ／スワイプで「重ねた画像」を移動できます。</p>
        <canvas id="canvas"></canvas>

        <button class="btn-flatten" onclick="setAsNewBackground()">現在の状態を新しい背景に設定する（結合）</button>
        <button class="btn-save" onclick="saveImage()">合成画像を保存する</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fallbackPasteArea = document.getElementById('fallbackPasteArea');
    const statusMsg = document.getElementById('statusMsg');
    const defaultFallbackText = '<span style="pointer-events: none;">👆 ここを長押しして「ペースト」を選択</span>';
    
    let activeTab = 'image'; // 'image' または 'text'

    // 背景と画像レイヤーの変数
    let bgImage = null;
    let fgImage = null;
    let customWidth = 800;
    let customHeight = 600;
    let fgX = 0, fgY = 0;
    let fgScale = 1.0;

    // テキストレイヤーの変数
    let textX = 400, textY = 300;
    let isTextInitialized = false;

    let isDragging = false;
    let startX, startY;

    updateCanvasSize();

    // スライダー操作時の画面ブレ防止
    ['scaleBox', 'textSizeBox'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener('touchmove', function(e) {
                e.stopPropagation();
            }, { passive: false });
        }
    });

    // タブ切り替え処理
    function switchTab(tabName) {
        activeTab = tabName;
        document.getElementById('tabBtnImage').classList.toggle('active', tabName === 'image');
        document.getElementById('tabBtnText').classList.toggle('active', tabName === 'text');
        document.getElementById('tabImage').style.display = (tabName === 'image') ? 'block' : 'none';
        document.getElementById('tabText').style.display = (tabName === 'text') ? 'block' : 'none';

        const guide = document.getElementById('dragGuideText');
        if (tabName === 'image') {
            guide.innerText = '※キャンバス上のドラッグ／スワイプで「重ねた画像」を移動できます。';
        } else {
            guide.innerText = '※キャンバス上のドラッグ／スワイプで「テキスト」を移動できます。';
            if (!isTextInitialized) {
                textX = customWidth / 2;
                textY = customHeight / 2;
                isTextInitialized = true;
            }
        }
        draw();
    }

    function updateCanvasSize() {
        customWidth = parseInt(document.getElementById('canvasW').value) || 800;
        customHeight = parseInt(document.getElementById('canvasH').value) || 600;
        if (!isTextInitialized) {
            textX = customWidth / 2;
            textY = customHeight / 2;
        }
        draw();
    }

    function updateScale() {
        fgScale = parseFloat(document.getElementById('fgScale').value);
        document.getElementById('scaleValue').innerText = Math.round(fgScale * 100) + '%';
        draw();
    }

    function updateTextLayer() {
        const size = document.getElementById('textSize').value;
        document.getElementById('textSizeValue').innerText = size + 'px';
        if (!isTextInitialized) {
            textX = customWidth / 2;
            textY = customHeight / 2;
            isTextInitialized = true;
        }
        draw();
    }

    function clearTextLayer() {
        document.getElementById('overlayText').value = '';
        draw();
    }

    // 描画処理（背景 ＋ 重ねる画像 ＋ テキストボックス）
    function draw() {
        canvas.width = customWidth;
        canvas.height = customHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 1. 背景画像の描画
        if (bgImage) {
            const mode = document.getElementById('bgMode').value;
            if (mode === 'stretch') {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                const scale = (mode === 'cover') 
                    ? Math.max(canvas.width / bgImage.width, canvas.height / bgImage.height)
                    : Math.min(canvas.width / bgImage.width, canvas.height / bgImage.height);
                const w = bgImage.width * scale;
                const h = bgImage.height * scale;
                ctx.drawImage(bgImage, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
            }
        }
        
        // 2. 重ねる画像の描画
        if (fgImage) {
            const w = fgImage.width * fgScale;
            const h = fgImage.height * fgScale;
            ctx.drawImage(fgImage, fgX, fgY, w, h);
        }

        // 3. テキストボックスの描画
        const rawText = document.getElementById('overlayText').value;
        if (rawText && rawText.trim().length > 0) {
            const lines = rawText.split('\n');
            const fontSize = parseInt(document.getElementById('textSize').value) || 40;
            const isBold = document.getElementById('textBold').checked;
            const textColor = document.getElementById('textColor').value;
            const hasOutline = document.getElementById('textOutline').checked;
            const outlineColor = document.getElementById('outlineColor').value;
            const boxBg = document.getElementById('textBoxBg').value;

            ctx.save();
            ctx.font = `${isBold ? 'bold ' : ''}${fontSize}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const lineHeight = fontSize * 1.25;
            const totalHeight = lines.length * lineHeight;

            // 背景ボックスの描画
            if (boxBg !== 'none') {
                let maxLineWidth = 0;
                for (const line of lines) {
                    const m = ctx.measureText(line);
                    if (m.width > maxLineWidth) maxLineWidth = m.width;
                }
                const padX = fontSize * 0.4;
                const padY = fontSize * 0.25;
                const boxW = maxLineWidth + padX * 2;
                const boxH = totalHeight + padY * 2;

                ctx.fillStyle = boxBg;
                ctx.fillRect(textX - boxW / 2, textY - boxH / 2, boxW, boxH);
            }

            // 各行の文字描画
            const startY = textY - (totalHeight / 2) + (lineHeight / 2);
            for (let i = 0; i < lines.length; i++) {
                const ly = startY + i * lineHeight;
                if (hasOutline) {
                    ctx.strokeStyle = outlineColor;
                    ctx.lineWidth = Math.max(2, Math.round(fontSize * 0.12));
                    ctx.lineJoin = 'round';
                    ctx.strokeText(lines[i], textX, ly);
                }
                ctx.fillStyle = textColor;
                ctx.fillText(lines[i], textX, ly);
            }
            ctx.restore();
        }
    }

    // 十字キーでの移動（開いているタブの対象を動かす）
    function moveActive(dx, dy) {
        if (activeTab === 'image') {
            fgX += dx;
            fgY += dy;
        } else {
            textX += dx;
            textY += dy;
        }
        draw();
    }

    function trimAndCheckTransparency(img) {
        const w = img.naturalWidth || img.width;
        const h = img.naturalHeight || img.height;
        const temp = document.createElement('canvas');
        temp.width = w;
        temp.height = h;
        const tCtx = temp.getContext('2d');
        tCtx.drawImage(img, 0, 0);

        const data = tCtx.getImageData(0, 0, w, h).data;

        let hasTransparentPixel = false;
        let minX = w, minY = h, maxX = -1, maxY = -1;

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const alpha = data[(y * w + x) * 4 + 3];
                if (alpha < 250) {
                    hasTransparentPixel = true;
                }
                if (alpha > 0) {
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
        }

        if (maxX < minX || maxY < minY) {
            return { canvas: temp, isCutout: false };
        }

        const cropW = maxX - minX + 1;
        const cropH = maxY - minY + 1;
        const outCanvas = document.createElement('canvas');
        outCanvas.width = cropW;
        outCanvas.height = cropH;
        outCanvas.getContext('2d').drawImage(temp, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

        return { canvas: outCanvas, isCutout: hasTransparentPixel };
    }

    function setForegroundResult(result) {
        fgImage = result.canvas;
        document.getElementById('fgScale').value = 1.0;
        fgScale = 1.0;
        document.getElementById('scaleValue').innerText = '100%';
        fgX = (customWidth - fgImage.width) / 2;
        fgY = (customHeight - fgImage.height) / 2;
        
        fallbackPasteArea.style.display = 'none';
        document.getElementById('fgFileName').innerText = "ペースト済";

        if (result.isCutout) {
            statusMsg.style.color = "#28a745";
            statusMsg.innerText = `✅ 切り抜き画像（透過あり）を配置しました (${fgImage.width}×${fgImage.height}px)`;
        } else {
            statusMsg.style.color = "#d9534f";
            statusMsg.innerText = `⚠️ 透過のない画像が貼られました（切り抜きコピーは光った後に指を離してコピー）`;
        }
        draw();
    }

    function blobToImage(blob) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = evt.target.result;
            };
            reader.onerror = () => resolve(null);
            reader.readAsDataURL(blob);
        });
    }

    async function handleButtonPaste() {
        statusMsg.style.color = "#0056b3";
        statusMsg.innerText = "⏳ クリップボードを読み取り中...";

        try {
            if (!navigator.clipboard || !navigator.clipboard.read) {
                throw new Error("Clipboard API non-supported");
            }

            const items = await navigator.clipboard.read();
            let fallbackRes = null;

            for (const item of items) {
                if (item.types.includes('image/png')) {
                    const blob = await item.getType('image/png');
                    const img = await blobToImage(blob);
                    if (img) {
                        const res = trimAndCheckTransparency(img);
                        if (res.isCutout) {
                            setForegroundResult(res);
                            return;
                        }
                        if (!fallbackRes) fallbackRes = res;
                    }
                }

                if (item.types.includes('text/html')) {
                    const blob = await item.getType('text/html');
                    const htmlText = await blob.text();
                    if (htmlText && htmlText.indexOf('<img') !== -1) {
                        const doc = new DOMParser().parseFromString(htmlText, 'text/html');
                        const imgTag = doc.querySelector('img');
                        if (imgTag && imgTag.src) {
                            const img = await new Promise((resolve) => {
                                const i = new Image();
                                i.crossOrigin = "anonymous";
                                i.onload = () => resolve(i);
                                i.onerror = () => resolve(null);
                                i.src = imgTag.src;
                            });
                            if (img) {
                                const res = trimAndCheckTransparency(img);
                                if (res.isCutout) {
                                    setForegroundResult(res);
                                    return;
                                }
                                if (!fallbackRes) fallbackRes = res;
                            }
                        }
                    }
                }

                for (const type of item.types) {
                    if (type.startsWith('image/') && type !== 'image/png') {
                        const blob = await item.getType(type);
                        const img = await blobToImage(blob);
                        if (img) {
                            const res = trimAndCheckTransparency(img);
                            if (res.isCutout) {
                                setForegroundResult(res);
                                return;
                            }
                            if (!fallbackRes) fallbackRes = res;
                        }
                    }
                }
            }

            if (fallbackRes) {
                setForegroundResult(fallbackRes);
                return;
            }

            showFallbackPaste("クリップボードから直接取得できませんでした。下の枠を長押ししてペーストしてください。");

        } catch (err) {
            showFallbackPaste("直接読み取りがブロックされました。下の枠を長押しして「ペースト」を押してください。");
        }
    }

    function showFallbackPaste(msg) {
        statusMsg.style.color = "#d9534f";
        statusMsg.innerText = msg;
        fallbackPasteArea.style.display = 'flex';
        fallbackPasteArea.innerHTML = defaultFallbackText;
    }

    window.addEventListener('paste', async function(e) {
        // テキスト入力欄にフォーカスがある時は通常の文字ペーストを許可する
        if (document.activeElement && document.activeElement.id === 'overlayText') {
            return;
        }

        const cd = e.clipboardData;
        if (!cd) return;

        const htmlText = cd.getData('text/html');
        let htmlImgSrc = null;
        if (htmlText && htmlText.indexOf('<img') !== -1) {
            const doc = new DOMParser().parseFromString(htmlText, 'text/html');
            const imgTag = doc.querySelector('img');
            if (imgTag && imgTag.src) htmlImgSrc = imgTag.src;
        }

        const files = [];
        if (cd.items) {
            for (let i = 0; i < cd.items.length; i++) {
                if (cd.items[i].type.indexOf('image') !== -1) {
                    const f = cd.items[i].getAsFile();
                    if (f) files.push(f);
                }
            }
        }
        if (files.length === 0 && cd.files) {
            for (let i = 0; i < cd.files.length; i++) {
                if (cd.files[i].type.indexOf('image') !== -1) {
                    files.push(cd.files[i]);
                }
            }
        }

        files.sort((a, b) => (b.type === 'image/png' ? 1 : 0) - (a.type === 'image/png' ? 1 : 0));

        if (files.length > 0 || htmlImgSrc) {
            e.preventDefault();
            setTimeout(() => {
                fallbackPasteArea.innerHTML = defaultFallbackText;
                fallbackPasteArea.blur();
            }, 80);

            let fallbackResult = null;

            for (const f of files) {
                const img = await blobToImage(f);
                if (!img) continue;
                const res = trimAndCheckTransparency(img);
                if (res.isCutout) {
                    setForegroundResult(res);
                    return;
                }
                if (!fallbackResult) fallbackResult = res;
            }

            if (htmlImgSrc) {
                const img = await new Promise((resolve) => {
                    const i = new Image();
                    i.onload = () => resolve(i);
                    i.onerror = () => resolve(null);
                    i.src = htmlImgSrc;
                });
                if (img) {
                    const res = trimAndCheckTransparency(img);
                    if (res.isCutout) {
                        setForegroundResult(res);
                        return;
                    }
                    if (!fallbackResult) fallbackResult = res;
                }
            }

            if (fallbackResult) {
                setForegroundResult(fallbackResult);
            }
        }
    });

    // ファイル選択（重ねる画像）
    document.getElementById('fgInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('fgFileName').innerText = file.name;
        const img = await blobToImage(file);
        if (img) {
            const res = trimAndCheckTransparency(img);
            setForegroundResult(res);
        }
    });

    // ファイル選択（背景画像）
    document.getElementById('bgInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('bgFileName').innerText = file.name;
        const img = await blobToImage(file);
        if (img) {
            bgImage = img;
            document.getElementById('canvasW').value = img.width;
            document.getElementById('canvasH').value = img.height;
            customWidth = img.width;
            customHeight = img.height;
            textX = customWidth / 2;
            textY = customHeight / 2;
            isTextInitialized = true;
            draw();
        }
    });

    // ドラッグ＆スワイプ移動（開いているタブの対象を移動）
    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX = e.clientX, clientY = e.clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function onPointerDown(e) {
        const pos = getCanvasPos(e);
        if (activeTab === 'image') {
            if (!fgImage) return;
            isDragging = true;
            startX = pos.x - fgX;
            startY = pos.y - fgY;
        } else {
            const rawText = document.getElementById('overlayText').value;
            if (!rawText || rawText.trim().length === 0) return;
            isDragging = true;
            startX = pos.x - textX;
            startY = pos.y - textY;
        }
    }

    function onPointerMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        const pos = getCanvasPos(e);
        if (activeTab === 'image') {
            fgX = pos.x - startX;
            fgY = pos.y - startY;
        } else {
            textX = pos.x - startX;
            textY = pos.y - startY;
        }
        draw();
    }

    function onPointerUp() { isDragging = false; }

    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('mouseleave', onPointerUp);
    canvas.addEventListener('touchstart', onPointerDown, {passive: false});
    canvas.addEventListener('touchmove', onPointerMove, {passive: false});
    canvas.addEventListener('touchend', onPointerUp);

    // 現在の状態を新しい背景に結合（画像もテキストも背景に焼き付ける）
    function setAsNewBackground() {
        const hasText = document.getElementById('overlayText').value.trim().length > 0;
        if (!bgImage && !fgImage && !hasText) {
            alert("画像やテキストが配置されていません。");
            return;
        }
        const dataURL = canvas.toDataURL('image/png');
        const img = new Image();
        img.onload = function() {
            bgImage = img;
            fgImage = null;
            document.getElementById('fgInput').value = "";
            document.getElementById('fgFileName').innerText = "未選択";
            document.getElementById('overlayText').value = "";
            document.getElementById('bgFileName').innerText = "結合画像";
            statusMsg.style.color = "#0056b3";
            statusMsg.innerText = "背景に結合しました。続けて次の画像やテキストを重ねられます。";
            draw();
        };
        img.src = dataURL;
    }

    function saveImage() {
        const hasText = document.getElementById('overlayText').value.trim().length > 0;
        if (!bgImage && !fgImage && !hasText) { 
            alert("画像やテキストが読み込まれていません。"); 
            return; 
        }
        const link = document.createElement('a');
        link.download = 'merged_image.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>

</body>
</html>
