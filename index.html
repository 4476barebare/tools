<!DOCTYPE html>
<html lang="ja" class="app-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>画像重ね合わせツール</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">

<div class="container app-container" id="appContainer">
    <h1 class="app-title" id="appTitle">画像重ね合わせツール</h1>
    
    <!-- ① 背景キャンバスの設定（常時表示） -->
    <div class="section-box section-bg-settings" id="sectionBgSettings">
        <div class="header-line bg-header-line">
            <span class="sec-title bg-sec-title">1. 背景キャンバスの設定</span>
            <div class="file-action-area bg-file-action-area">
                <span id="bgFileName" class="file-status bg-file-status">未選択</span>
                <label class="file-btn-label bg-file-btn-label" id="bgFileBtnLabel">
                    <span class="file-btn-text bg-file-btn-text">ファイルを選択</span>
                    <input type="file" id="bgInput" class="file-input bg-file-input" accept="image/*">
                </label>
            </div>
        </div>

        <div class="size-row bg-size-row">
            <label class="inline-label size-label width-label" for="canvasW">
                <span class="label-text width-label-text">幅:</span>
                <input type="number" id="canvasW" class="number-input width-input" value="800">
                <span class="unit-text width-unit-text">px</span>
            </label>
            <label class="inline-label size-label height-label" for="canvasH">
                <span class="label-text height-label-text">高さ:</span>
                <input type="number" id="canvasH" class="number-input height-input" value="600">
                <span class="unit-text height-unit-text">px</span>
            </label>
            <button type="button" class="btn-small btn-apply-size" id="btnApplySize" onclick="updateCanvasSize()">サイズ適用</button>
        </div>

        <div class="select-row bg-select-row">
            <span class="inline-label select-label bg-mode-label">背景の配置:</span>
            <select id="bgMode" class="select-input bg-mode-select" onchange="draw()">
                <option value="stretch" class="select-option bg-option-stretch">引き伸ばす（縦横比を無視）</option>
                <option value="cover" class="select-option bg-option-cover">はみ出しをカット（縦横比維持・全面）</option>
                <option value="contain" class="select-option bg-option-contain">余白を透明に補完（縦横比維持・全体）</option>
            </select>
        </div>
    </div>
    
    <!-- ② 重ねる要素の編集（タブ切り替えエリア） -->
    <div class="tab-wrapper editor-tab-wrapper" id="editorTabWrapper">
        <div class="tab-header editor-tab-header">
            <button type="button" class="tab-btn tab-btn-image is-active" id="tabBtnImage" onclick="switchTab('image')">
                <span class="tab-icon tab-icon-image">🖼️</span>
                <span class="tab-label tab-label-image">2. 画像を重ねる</span>
            </button>
            <button type="button" class="tab-btn tab-btn-text" id="tabBtnText" onclick="switchTab('text')">
                <span class="tab-icon tab-icon-text">🔤</span>
                <span class="tab-label tab-label-text">2. テキストを重ねる</span>
            </button>
        </div>

        <!-- タブA: 画像を重ねる -->
        <div class="section-box tab-content tab-content-image" id="tabImage">
            <div class="header-line fg-header-line">
                <span class="sec-title fg-sec-title">重ねる画像の読み込み</span>
                <div class="file-action-area fg-file-action-area">
                    <span id="fgFileName" class="file-status fg-file-status">未選択</span>
                    <label class="file-btn-label fg-file-btn-label" id="fgFileBtnLabel">
                        <span class="file-btn-text fg-file-btn-text">ファイルを選択</span>
                        <input type="file" id="fgInput" class="file-input fg-file-input" accept="image/*">
                    </label>
                </div>
            </div>

            <button type="button" class="btn-paste fg-paste-btn" id="pasteBtn" onclick="handleButtonPaste()">
                <span class="paste-btn-icon">📋</span>
                <span class="paste-btn-text">クリップボードからペースト</span>
            </button>

            <div id="fallbackPasteArea" class="fallback-paste-area is-hidden" contenteditable="true">
                <span class="fallback-paste-placeholder">👆 ここを長押しして「ペースト」を選択</span>
            </div>

            <div id="statusMsg" class="status-msg fg-status-msg"></div>

            <div class="controls fg-controls">
                <div class="pad-column fg-pad-column">
                    <div class="d-pad fg-d-pad">
                        <button type="button" class="d-pad-btn up fg-btn-up" onclick="moveActive(0, -10)">↑</button>
                        <button type="button" class="d-pad-btn left fg-btn-left" onclick="moveActive(-10, 0)">←</button>
                        <button type="button" class="d-pad-btn down fg-btn-down" onclick="moveActive(0, 10)">↓</button>
                        <button type="button" class="d-pad-btn right fg-btn-right" onclick="moveActive(10, 0)">→</button>
                    </div>
                    <div class="angle-step-row fg-angle-step-row">
                        <button type="button" class="angle-step-btn angle-minus-btn fg-angle-minus" onclick="stepAngle(-1)">↶ -1°</button>
                        <button type="button" class="angle-step-btn angle-plus-btn fg-angle-plus" onclick="stepAngle(1)">↷ +1°</button>
                    </div>
                </div>
                <div class="sliders-stack fg-sliders-stack">
                    <div class="scale-control fg-scale-control" id="scaleBox">
                        <div class="slider-header fg-scale-header">
                            <strong class="slider-title fg-scale-title">縮尺: <span id="scaleValue" class="slider-value fg-scale-value">100%</span></strong>
                            <button type="button" class="btn-mini btn-flip-horizontal" id="btnFlipFg" onclick="toggleFlipFg()">↔ 左右反転</button>
                        </div>
                        <input type="range" id="fgScale" class="range-input fg-scale-range" min="0.1" max="5.0" step="0.05" value="1.0" oninput="updateScale()">
                    </div>
                    <div class="scale-control fg-angle-control" id="angleBox">
                        <div class="slider-header fg-angle-header">
                            <strong class="slider-title fg-angle-title">角度: <span id="angleValue" class="slider-value fg-angle-value">0°</span></strong>
                            <button type="button" class="btn-mini btn-reset-angle" id="btnResetFgAngle" onclick="resetFgAngle()">0°に戻す</button>
                        </div>
                        <input type="range" id="fgAngle" class="range-input fg-angle-range" min="-180" max="180" step="1" value="0" oninput="updateAngle()">
                    </div>
                </div>
            </div>
        </div>

        <!-- タブB: テキストを重ねる -->
        <div class="section-box tab-content tab-content-text is-hidden" id="tabText">
            <div class="text-input-row">
                <textarea id="overlayText" class="text-area-input overlay-textarea" rows="2" placeholder="ここに入力した文字がキャンバスに重なります（改行対応）" oninput="updateTextLayer()"></textarea>
                <button type="button" class="btn-clear-text" id="btnClearText" onclick="clearTextLayer()">消去</button>
            </div>

            <div class="text-style-row">
                <label class="inline-label text-color-label" for="textColor">
                    <span class="label-text">文字色:</span>
                    <input type="color" id="textColor" class="color-input text-color-input" value="#ffffff" onchange="updateTextLayer()">
                </label>
                <label class="inline-label text-outline-label" for="textOutline">
                    <input type="checkbox" id="textOutline" class="checkbox-input text-outline-checkbox" checked onchange="updateTextLayer()">
                    <span class="label-text">フチ:</span>
                    <input type="color" id="outlineColor" class="color-input outline-color-input" value="#000000" onchange="updateTextLayer()">
                </label>
                <label class="inline-label text-bold-label" for="textBold">
                    <input type="checkbox" id="textBold" class="checkbox-input text-bold-checkbox" checked onchange="updateTextLayer()">
                    <span class="label-text">太字</span>
                </label>
                <label class="inline-label text-vertical-label" for="textVertical">
                    <input type="checkbox" id="textVertical" class="checkbox-input text-vertical-checkbox" onchange="updateTextLayer()">
                    <span class="label-text">縦書き</span>
                </label>
            </div>

            <div class="select-row text-bg-select-row">
                <span class="inline-label select-label text-bg-label">背景枠:</span>
                <select id="textBoxBg" class="select-input text-bg-select" onchange="updateTextLayer()">
                    <option value="none" class="select-option text-bg-option-none">なし（透明）</option>
                    <option value="rgba(0,0,0,0.6)" class="select-option text-bg-option-dark">半透明の黒ボックス</option>
                    <option value="rgba(255,255,255,0.75)" class="select-option text-bg-option-light">半透明の白ボックス</option>
                    <option value="#000000" class="select-option text-bg-option-black">黒塗りボックス</option>
                    <option value="#ffffff" class="select-option text-bg-option-white">白塗りボックス</option>
                </select>
            </div>

            <div class="controls text-controls">
                <div class="pad-column text-pad-column">
                    <div class="d-pad text-d-pad">
                        <button type="button" class="d-pad-btn up text-btn-up" onclick="moveActive(0, -10)">↑</button>
                        <button type="button" class="d-pad-btn left text-btn-left" onclick="moveActive(-10, 0)">←</button>
                        <button type="button" class="d-pad-btn down text-btn-down" onclick="moveActive(0, 10)">↓</button>
                        <button type="button" class="d-pad-btn right text-btn-right" onclick="moveActive(10, 0)">→</button>
                    </div>
                    <div class="angle-step-row text-angle-step-row">
                        <button type="button" class="angle-step-btn angle-minus-btn text-angle-minus" onclick="stepAngle(-1)">↶ -1°</button>
                        <button type="button" class="angle-step-btn angle-plus-btn text-angle-plus" onclick="stepAngle(1)">↷ +1°</button>
                    </div>
                </div>
                <div class="sliders-stack text-sliders-stack">
                    <div class="scale-control text-size-control" id="textSizeBox">
                        <div class="slider-header text-size-header">
                            <strong class="slider-title text-size-title">文字サイズ: <span id="textSizeValue" class="slider-value text-size-value">40px</span></strong>
                        </div>
                        <input type="range" id="textSize" class="range-input text-size-range" min="12" max="160" step="2" value="40" oninput="updateTextLayer()">
                    </div>
                    <div class="scale-control text-angle-control" id="textAngleBox">
                        <div class="slider-header text-angle-header">
                            <strong class="slider-title text-angle-title">角度: <span id="textAngleValue" class="slider-value text-angle-value">0°</span></strong>
                            <button type="button" class="btn-mini btn-reset-angle" id="btnResetTextAngle" onclick="resetTextAngle()">0°に戻す</button>
                        </div>
                        <input type="range" id="textAngle" class="range-input text-angle-range" min="-180" max="180" step="1" value="0" oninput="updateTextLayer()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ③ キャンバス表示 ＆ 新しい背景に設定・保存ボタン（常時表示） -->
    <div class="section-footer preview-footer-section" id="sectionFooter">
        <p class="guide-text canvas-guide-text" id="dragGuideText">※キャンバス上のドラッグ／スワイプで「重ねた画像」を移動できます。</p>
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="canvas" class="main-canvas"></canvas>
        </div>

        <div class="footer-actions" id="footerActions">
            <button type="button" class="btn-flatten action-btn-flatten" id="btnFlatten" onclick="setAsNewBackground()">現在の状態を新しい背景に設定する（結合）</button>
            <button type="button" class="btn-save action-btn-save" id="btnSave" onclick="saveImage()">合成画像を保存する</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fallbackPasteArea = document.getElementById('fallbackPasteArea');
    const statusMsg = document.getElementById('statusMsg');
    const defaultFallbackText = '<span class="fallback-paste-placeholder">👆 ここを長押しして「ペースト」を選択</span>';
    
    let activeTab = 'image';

    // 背景と画像レイヤーの変数（fgX, fgY は画像の中心座標）
    let bgImage = null;
    let currentBgObjectUrl = null; // メモリ解放管理用のBlob URL
    let fgImage = null;
    let customWidth = 800;
    let customHeight = 600;
    let fgX = 400, fgY = 300;
    let fgScale = 1.0;
    let fgAngle = 0;
    let fgFlipX = false;

    // テキストレイヤーの変数（textX, textY はテキストの中心座標）
    let textX = 400, textY = 300;
    let textAngle = 0;
    let isTextInitialized = false;

    let isDragging = false;
    let startX, startY;

    updateCanvasSize();

    // スライダー操作時の画面ブレ防止
    ['scaleBox', 'angleBox', 'textSizeBox', 'textAngleBox'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener('touchmove', function(e) {
                e.stopPropagation();
            }, { passive: false });
        }
    });

    // ステータスメッセージのクラス制御ヘルパー
    function setStatusMessage(text, type) {
        statusMsg.classList.remove('is-success', 'is-error', 'is-info');
        if (type === 'success') statusMsg.classList.add('is-success');
        else if (type === 'error') statusMsg.classList.add('is-error');
        else statusMsg.classList.add('is-info');
        statusMsg.innerText = text;
    }

    // タブ切り替え処理
    function switchTab(tabName) {
        activeTab = tabName;
        const isImg = (tabName === 'image');

        document.getElementById('tabBtnImage').classList.toggle('is-active', isImg);
        document.getElementById('tabBtnText').classList.toggle('is-active', !isImg);
        document.getElementById('tabImage').classList.toggle('is-hidden', !isImg);
        document.getElementById('tabText').classList.toggle('is-hidden', isImg);

        const guide = document.getElementById('dragGuideText');
        if (isImg) {
            guide.innerText = '※キャンバス上のドラッグ／スワイプで「重ねた画像」を移動できます。';
        } else {
            guide.innerText = '※キャンバス上のドラッグ／スワイプで「テキスト」を移動できます。';
            if (!isTextInitialized) {
                textX = customWidth / 2;
                textY = customHeight / 2;
                isTextInitialized = true;
            }
        }
        draw();
    }

    function updateCanvasSize() {
        customWidth = parseInt(document.getElementById('canvasW').value) || 800;
        customHeight = parseInt(document.getElementById('canvasH').value) || 600;
        if (!isTextInitialized) {
            textX = customWidth / 2;
            textY = customHeight / 2;
        }
        draw();
    }

    function updateScale() {
        fgScale = parseFloat(document.getElementById('fgScale').value);
        document.getElementById('scaleValue').innerText = Math.round(fgScale * 100) + '%';
        draw();
    }

    function updateAngle() {
        fgAngle = parseInt(document.getElementById('fgAngle').value) || 0;
        document.getElementById('angleValue').innerText = fgAngle + '°';
        draw();
    }

    function resetFgAngle() {
        fgAngle = 0;
        document.getElementById('fgAngle').value = 0;
        document.getElementById('angleValue').innerText = '0°';
        draw();
    }

    function stepAngle(delta) {
        if (activeTab === 'image') {
            fgAngle = Math.max(-180, Math.min(180, fgAngle + delta));
            document.getElementById('fgAngle').value = fgAngle;
            document.getElementById('angleValue').innerText = fgAngle + '°';
        } else {
            textAngle = Math.max(-180, Math.min(180, textAngle + delta));
            document.getElementById('textAngle').value = textAngle;
            document.getElementById('textAngleValue').innerText = textAngle + '°';
        }
        draw();
    }

    function toggleFlipFg() {
        fgFlipX = !fgFlipX;
        document.getElementById('btnFlipFg').classList.toggle('is-flipped', fgFlipX);
        draw();
    }

    function updateTextLayer() {
        const size = document.getElementById('textSize').value;
        document.getElementById('textSizeValue').innerText = size + 'px';
        textAngle = parseInt(document.getElementById('textAngle').value) || 0;
        document.getElementById('textAngleValue').innerText = textAngle + '°';

        if (!isTextInitialized) {
            textX = customWidth / 2;
            textY = customHeight / 2;
            isTextInitialized = true;
        }
        draw();
    }

    function resetTextAngle() {
        textAngle = 0;
        document.getElementById('textAngle').value = 0;
        document.getElementById('textAngleValue').innerText = '0°';
        draw();
    }

    function clearTextLayer() {
        document.getElementById('overlayText').value = '';
        resetTextAngle();
        draw();
    }

    function isVerticalRotChar(ch) {
        return 'ーｰ～〜…‥｜|()（）[]［］{}｛｝「」『』【】〈〉《》〔〕＜＞<>-－＝='.includes(ch);
    }

    function isVerticalSmallOrPunct(ch) {
        return '、。，．っゃゅょぁぃぅぇぉッャュョァィゥェォヵヶ'.includes(ch);
    }

    function draw() {
        canvas.width = customWidth;
        canvas.height = customHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 1. 背景画像の描画
        if (bgImage) {
            const mode = document.getElementById('bgMode').value;
            if (mode === 'stretch') {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                const scale = (mode === 'cover') 
                    ? Math.max(canvas.width / bgImage.width, canvas.height / bgImage.height)
                    : Math.min(canvas.width / bgImage.width, canvas.height / bgImage.height);
                const w = bgImage.width * scale;
                const h = bgImage.height * scale;
                ctx.drawImage(bgImage, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
            }
        }
        
        // 2. 重ねる画像の描画
        if (fgImage) {
            const w = fgImage.width * fgScale;
            const h = fgImage.height * fgScale;
            ctx.save();
            ctx.translate(fgX, fgY);
            ctx.rotate(fgAngle * Math.PI / 180);
            if (fgFlipX) {
                ctx.scale(-1, 1);
            }
            ctx.drawImage(fgImage, -w / 2, -h / 2, w, h);
            ctx.restore();
        }

        // 3. テキストボックスの描画
        const rawText = document.getElementById('overlayText').value;
        if (rawText && rawText.trim().length > 0) {
            const lines = rawText.split('\n');
            const fontSize = parseInt(document.getElementById('textSize').value) || 40;
            const isBold = document.getElementById('textBold').checked;
            const isVertical = document.getElementById('textVertical').checked;
            const textColor = document.getElementById('textColor').value;
            const hasOutline = document.getElementById('textOutline').checked;
            const outlineColor = document.getElementById('outlineColor').value;
            const boxBg = document.getElementById('textBoxBg').value;

            ctx.save();
            ctx.translate(textX, textY);
            ctx.rotate(textAngle * Math.PI / 180);

            ctx.font = `${isBold ? 'bold ' : ''}${fontSize}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const strokeW = Math.max(2, Math.round(fontSize * 0.12));

            if (!isVertical) {
                const lineHeight = fontSize * 1.25;
                const totalHeight = lines.length * lineHeight;

                if (boxBg !== 'none') {
                    let maxLineWidth = 0;
                    for (const line of lines) {
                        const m = ctx.measureText(line);
                        if (m.width > maxLineWidth) maxLineWidth = m.width;
                    }
                    const padX = fontSize * 0.4;
                    const padY = fontSize * 0.25;
                    const boxW = maxLineWidth + padX * 2;
                    const boxH = totalHeight + padY * 2;

                    ctx.fillStyle = boxBg;
                    ctx.fillRect(-boxW / 2, -boxH / 2, boxW, boxH);
                }

                const startY = -(totalHeight / 2) + (lineHeight / 2);
                for (let i = 0; i < lines.length; i++) {
                    const ly = startY + i * lineHeight;
                    if (hasOutline) {
                        ctx.strokeStyle = outlineColor;
                        ctx.lineWidth = strokeW;
                        ctx.lineJoin = 'round';
                        ctx.strokeText(lines[i], 0, ly);
                    }
                    ctx.fillStyle = textColor;
                    ctx.fillText(lines[i], 0, ly);
                }
            } else {
                const charStepY = fontSize * 1.08;
                const colStepX = fontSize * 1.35;
                const numCols = lines.length;
                let maxChars = 0;
                for (const line of lines) {
                    const chars = Array.from(line);
                    if (chars.length > maxChars) maxChars = chars.length;
                }

                const totalWidth = numCols * colStepX;
                const totalHeight = maxChars * charStepY;

                if (boxBg !== 'none') {
                    const padX = fontSize * 0.35;
                    const padY = fontSize * 0.35;
                    const boxW = totalWidth + padX * 2;
                    const boxH = totalHeight + padY * 2;

                    ctx.fillStyle = boxBg;
                    ctx.fillRect(-boxW / 2, -boxH / 2, boxW, boxH);
                }

                const startX = (totalWidth / 2) - (colStepX / 2);
                const startY = -(totalHeight / 2) + (charStepY / 2);

                for (let c = 0; c < numCols; c++) {
                    const colX = startX - c * colStepX;
                    const chars = Array.from(lines[c]);
                    for (let r = 0; r < chars.length; r++) {
                        const ch = chars[r];
                        const charY = startY + r * charStepY;

                        ctx.save();
                        ctx.translate(colX, charY);

                        if (isVerticalRotChar(ch)) {
                            ctx.rotate(Math.PI / 2);
                        } else if (isVerticalSmallOrPunct(ch)) {
                            ctx.translate(fontSize * 0.22, -fontSize * 0.22);
                        }

                        if (hasOutline) {
                            ctx.strokeStyle = outlineColor;
                            ctx.lineWidth = strokeW;
                            ctx.lineJoin = 'round';
                            ctx.strokeText(ch, 0, 0);
                        }
                        ctx.fillStyle = textColor;
                        ctx.fillText(ch, 0, 0);
                        ctx.restore();
                    }
                }
            }
            ctx.restore();
        }
    }

    function moveActive(dx, dy) {
        if (activeTab === 'image') {
            fgX += dx;
            fgY += dy;
        } else {
            textX += dx;
            textY += dy;
        }
        draw();
    }

    function trimAndCheckTransparency(img) {
        const w = img.naturalWidth || img.width;
        const h = img.naturalHeight || img.height;
        const temp = document.createElement('canvas');
        temp.width = w;
        temp.height = h;
        const tCtx = temp.getContext('2d');
        tCtx.drawImage(img, 0, 0);

        const data = tCtx.getImageData(0, 0, w, h).data;

        let hasTransparentPixel = false;
        let minX = w, minY = h, maxX = -1, maxY = -1;

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const alpha = data[(y * w + x) * 4 + 3];
                if (alpha < 250) {
                    hasTransparentPixel = true;
                }
                if (alpha > 0) {
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
        }

        if (maxX < minX || maxY < minY) {
            return { canvas: temp, isCutout: false };
        }

        const cropW = maxX - minX + 1;
        const cropH = maxY - minY + 1;
        const outCanvas = document.createElement('canvas');
        outCanvas.width = cropW;
        outCanvas.height = cropH;
        outCanvas.getContext('2d').drawImage(temp, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

        // 一時キャンバスのメモリを即座に解放
        temp.width = 1;
        temp.height = 1;

        return { canvas: outCanvas, isCutout: hasTransparentPixel };
    }

    function setForegroundResult(result) {
        if (fgImage && fgImage !== result.canvas) {
            fgImage.width = 1;
            fgImage.height = 1;
        }
        fgImage = result.canvas;
        document.getElementById('fgScale').value = 1.0;
        fgScale = 1.0;
        document.getElementById('scaleValue').innerText = '100%';
        
        document.getElementById('fgAngle').value = 0;
        fgAngle = 0;
        document.getElementById('angleValue').innerText = '0°';
        fgFlipX = false;
        document.getElementById('btnFlipFg').classList.remove('is-flipped');

        fgX = customWidth / 2;
        fgY = customHeight / 2;
        
        fallbackPasteArea.classList.add('is-hidden');
        document.getElementById('fgFileName').innerText = "ペースト済";

        if (result.isCutout) {
            setStatusMessage(`✅ 切り抜き画像（透過あり）を配置しました (${fgImage.width}×${fgImage.height}px)`, 'success');
        } else {
            setStatusMessage(`⚠️ 透過のない画像が貼られました（切り抜きコピーは光った後に指を離してコピー）`, 'error');
        }
        draw();
    }

    // DataURLを使わずメモリ負荷の低いObjectURLでImageを生成する
    function blobToImage(blob) {
        return new Promise((resolve) => {
            if (!blob) {
                resolve(null);
                return;
            }
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(url);
                resolve(img);
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                resolve(null);
            };
            img.src = url;
        });
    }

    async function handleButtonPaste() {
        setStatusMessage("⏳ クリップボードを読み取り中...", 'info');

        try {
            if (!navigator.clipboard || !navigator.clipboard.read) {
                throw new Error("Clipboard API non-supported");
            }

            const items = await navigator.clipboard.read();
            let fallbackRes = null;

            for (const item of items) {
                if (item.types.includes('image/png')) {
                    const blob = await item.getType('image/png');
                    const img = await blobToImage(blob);
                    if (img) {
                        const res = trimAndCheckTransparency(img);
                        if (res.isCutout) {
                            setForegroundResult(res);
                            return;
                        }
                        if (!fallbackRes) fallbackRes = res;
                    }
                }

                if (item.types.includes('text/html')) {
                    const blob = await item.getType('text/html');
                    const htmlText = await blob.text();
                    if (htmlText && htmlText.indexOf('<img') !== -1) {
                        const doc = new DOMParser().parseFromString(htmlText, 'text/html');
                        const imgTag = doc.querySelector('img');
                        if (imgTag && imgTag.src) {
                            const img = await new Promise((resolve) => {
                                const i = new Image();
                                i.crossOrigin = "anonymous";
                                i.onload = () => resolve(i);
                                i.onerror = () => resolve(null);
                                i.src = imgTag.src;
                            });
                            if (img) {
                                const res = trimAndCheckTransparency(img);
                                if (res.isCutout) {
                                    setForegroundResult(res);
                                    return;
                                }
                                if (!fallbackRes) fallbackRes = res;
                            }
                        }
                    }
                }

                for (const type of item.types) {
                    if (type.startsWith('image/') && type !== 'image/png') {
                        const blob = await item.getType(type);
                        const img = await blobToImage(blob);
                        if (img) {
                            const res = trimAndCheckTransparency(img);
                            if (res.isCutout) {
                                setForegroundResult(res);
                                return;
                            }
                            if (!fallbackRes) fallbackRes = res;
                        }
                    }
                }
            }

            if (fallbackRes) {
                setForegroundResult(fallbackRes);
                return;
            }

            showFallbackPaste("クリップボードから直接取得できませんでした。下の枠を長押ししてペーストしてください。");

        } catch (err) {
            showFallbackPaste("直接読み取りがブロックされました。下の枠を長押しして「ペースト」を押してください。");
        }
    }

    function showFallbackPaste(msg) {
        setStatusMessage(msg, 'error');
        fallbackPasteArea.classList.remove('is-hidden');
        fallbackPasteArea.innerHTML = defaultFallbackText;
    }

    window.addEventListener('paste', async function(e) {
        if (document.activeElement && document.activeElement.id === 'overlayText') {
            return;
        }

        const cd = e.clipboardData;
        if (!cd) return;

        const htmlText = cd.getData('text/html');
        let htmlImgSrc = null;
        if (htmlText && htmlText.indexOf('<img') !== -1) {
            const doc = new DOMParser().parseFromString(htmlText, 'text/html');
            const imgTag = doc.querySelector('img');
            if (imgTag && imgTag.src) htmlImgSrc = imgTag.src;
        }

        const files = [];
        if (cd.items) {
            for (let i = 0; i < cd.items.length; i++) {
                if (cd.items[i].type.indexOf('image') !== -1) {
                    const f = cd.items[i].getAsFile();
                    if (f) files.push(f);
                }
            }
        }
        if (files.length === 0 && cd.files) {
            for (let i = 0; i < cd.files.length; i++) {
                if (cd.files[i].type.indexOf('image') !== -1) {
                    files.push(cd.files[i]);
                }
            }
        }

        files.sort((a, b) => (b.type === 'image/png' ? 1 : 0) - (a.type === 'image/png' ? 1 : 0));

        if (files.length > 0 || htmlImgSrc) {
            e.preventDefault();
            setTimeout(() => {
                fallbackPasteArea.innerHTML = defaultFallbackText;
                fallbackPasteArea.blur();
            }, 80);

            let fallbackResult = null;

            for (const f of files) {
                const img = await blobToImage(f);
                if (!img) continue;
                const res = trimAndCheckTransparency(img);
                if (res.isCutout) {
                    setForegroundResult(res);
                    return;
                }
                if (!fallbackResult) fallbackResult = res;
            }

            if (htmlImgSrc) {
                const img = await new Promise((resolve) => {
                    const i = new Image();
                    i.onload = () => resolve(i);
                    i.onerror = () => resolve(null);
                    i.src = htmlImgSrc;
                });
                if (img) {
                    const res = trimAndCheckTransparency(img);
                    if (res.isCutout) {
                        setForegroundResult(res);
                        return;
                    }
                    if (!fallbackResult) fallbackResult = res;
                }
            }

            if (fallbackResult) {
                setForegroundResult(fallbackResult);
            }
        }
    });

    // ファイル選択（重ねる画像）
    document.getElementById('fgInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('fgFileName').innerText = file.name;
        const img = await blobToImage(file);
        if (img) {
            const res = trimAndCheckTransparency(img);
            setForegroundResult(res);
        }
    });

    // ファイル選択（背景画像：ObjectURL管理で省メモリ化）
    document.getElementById('bgInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('bgFileName').innerText = file.name;
        
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = function() {
            if (currentBgObjectUrl) {
                URL.revokeObjectURL(currentBgObjectUrl);
            }
            currentBgObjectUrl = url;
            bgImage = img;
            document.getElementById('canvasW').value = img.width;
            document.getElementById('canvasH').value = img.height;
            customWidth = img.width;
            customHeight = img.height;
            textX = customWidth / 2;
            textY = customHeight / 2;
            isTextInitialized = true;
            draw();
        };
        img.src = url;
    });

    // ドラッグ＆スワイプ移動
    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX = e.clientX, clientY = e.clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function onPointerDown(e) {
        const pos = getCanvasPos(e);
        if (activeTab === 'image') {
            if (!fgImage) return;
            isDragging = true;
            startX = pos.x - fgX;
            startY = pos.y - fgY;
        } else {
            const rawText = document.getElementById('overlayText').value;
            if (!rawText || rawText.trim().length === 0) return;
            isDragging = true;
            startX = pos.x - textX;
            startY = pos.y - textY;
        }
    }

    function onPointerMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        const pos = getCanvasPos(e);
        if (activeTab === 'image') {
            fgX = pos.x - startX;
            fgY = pos.y - startY;
        } else {
            textX = pos.x - startX;
            textY = pos.y - startY;
        }
        draw();
    }

    function onPointerUp() { isDragging = false; }

    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('mouseleave', onPointerUp);
    canvas.addEventListener('touchstart', onPointerDown, {passive: false});
    canvas.addEventListener('touchmove', onPointerMove, {passive: false});
    canvas.addEventListener('touchend', onPointerUp);

    // 【クラッシュ防止版】現在の状態を新しい背景に結合（Blob方式＋メモリ解放）
    function setAsNewBackground() {
        const hasText = document.getElementById('overlayText').value.trim().length > 0;
        if (!bgImage && !fgImage && !hasText) {
            alert("画像やテキストが配置されていません。");
            return;
        }
        
        canvas.toBlob(function(blob) {
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = function() {
                if (currentBgObjectUrl) {
                    URL.revokeObjectURL(currentBgObjectUrl);
                }
                currentBgObjectUrl = url;
                bgImage = img;
                
                if (fgImage) {
                    fgImage.width = 1;
                    fgImage.height = 1;
                    fgImage = null;
                }
                
                document.getElementById('fgInput').value = "";
                document.getElementById('fgFileName').innerText = "未選択";
                document.getElementById('overlayText').value = "";
                resetFgAngle();
                resetTextAngle();
                fgFlipX = false;
                document.getElementById('btnFlipFg').classList.remove('is-flipped');
                document.getElementById('bgFileName').innerText = "結合画像";
                setStatusMessage("背景に結合しました。続けて次の画像やテキストを重ねられます。", 'info');
                draw();
            };
            img.src = url;
        }, 'image/png');
    }

    // 【クラッシュ防止版】合成画像の保存（Blobダウンロード方式＋メモリ解放）
    function saveImage() {
        const hasText = document.getElementById('overlayText').value.trim().length > 0;
        if (!bgImage && !fgImage && !hasText) { 
            alert("画像やテキストが読み込まれていません。"); 
            return; 
        }
        
        canvas.toBlob(function(blob) {
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.className = 'download-trigger-link';
            link.download = 'merged_image.png';
            link.href = url;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            setTimeout(() => {
                URL.revokeObjectURL(url);
            }, 3000);
        }, 'image/png');
    }
</script>
